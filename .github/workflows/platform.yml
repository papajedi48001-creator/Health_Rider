name: platform

on:
  pull_request:
  push:
    branches: [codex/health-rider-nextjs]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    services:
      mariadb:
        image: mariadb:11.7
        env:
          MARIADB_DATABASE: health_rider
          MARIADB_USER: health_rider
          MARIADB_PASSWORD: ci-only-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # CI uses root so one URL can migrate, seed and run the app against the throwaway database.
      DATABASE_URL: mysql://root:ci-only-root-password@127.0.0.1:3306/health_rider
      AUTH_SECRET: ci-only-auth-secret-0123456789abcdefghij
      EVIDENCE_STORAGE_PATH: /tmp/health-rider-evidence
      SEED_UAT_PASSWORD: ci-only-uat-password
      SEED_ZONES_FILE: prisma/seed-data/delivery-zones.example.csv
      E2E_PASSWORD: ci-only-uat-password
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against the standalone server
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          mkdir -p "$EVIDENCE_STORAGE_PATH"
          (cd .next/standalone && NODE_ENV=production PORT=3000 node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/login > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/login > /dev/null || (cat server.log; exit 1)
          npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: platform/test-results
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime platform
      - run: docker build --target migrate platform
