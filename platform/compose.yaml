services:
  db:
    image: mariadb:11.7
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-health_rider}
      MARIADB_USER: ${MARIADB_USER:-health_rider}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-health_rider-development-only}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-health-rider-root-development-only}
    volumes:
      - health-rider-db:/var/lib/mysql
    healthcheck:
      # Passes only once the real server accepts TCP connections, not while first-run init uses a temporary server.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://health_rider:health_rider-development-only@db:3306/health_rider}
      SEED_UAT_PASSWORD: ${SEED_UAT_PASSWORD:-}
      SEED_ZONES_FILE: ${SEED_ZONES_FILE:-}

  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-mysql://health_rider:health_rider-development-only@db:3306/health_rider}
      HOS_DATABASE_URL: ${HOS_DATABASE_URL:-}
      HOS_ELIGIBLE_ITEM_CODES: ${HOS_ELIGIBLE_ITEM_CODES:-}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a random value of at least 32 characters}
      EVIDENCE_STORAGE_PATH: /app/data/evidence
      SESSION_COOKIE_INSECURE: ${SESSION_COOKIE_INSECURE:-}
    ports:
      - "3000:3000"
    volumes:
      - health-rider-evidence:/app/data/evidence

  # Optional: `docker compose --profile https up -d` adds HTTPS on port 443 for rider phones.
  https:
    image: caddy:2.8
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - web
    environment:
      HTTPS_HOST: ${HTTPS_HOST:-localhost}
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - health-rider-caddy:/data

volumes:
  health-rider-db:
  health-rider-evidence:
  health-rider-caddy:
